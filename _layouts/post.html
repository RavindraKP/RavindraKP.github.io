---
layout: default
---
<article>
  <header class="article-head">
    <h1>{{ page.title }}</h1>
    <p class="meta">{{ page.date | date: "%-d %B %Y" }}{% if page.tags and page.tags.size > 0 %} &middot; {{ page.tags | join: ", " }}{% endif %}</p>
  </header>
  <div class="prose">{{ content }}</div>
  <p class="back"><a href="{{ '/blog/' | relative_url }}">All posts</a></p>
</article>
